# The checks of the app on every push to master and every pull request: Android Lint, detekt and the unit tests with
# Kover, and Pantrix MQ's verdict on what they found.
#
# MQ comes from GitHub Packages of developersancho/pantrix-mq through .github/pantrix-mq.init.gradle.kts, so the
# build itself needs no token. MQ_PACKAGES_TOKEN is a token that only reads packages. A pull request from a fork has
# no secrets: its checks run, and MQ does not. The version of MQ is in .github/pantrix-mq.version, for the init script
# and for pmq alike.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  # A newer push to a pull request makes the run for the older one pointless. On master every run is kept.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, detekt, unit tests and MQ
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      # For MQ's store of baselines: the artifacts master's runs left, which pmq lists and downloads.
      actions: read
    # TRIAL, not to be merged: the job that judges the part has no checkout, and takes the version of MQ from here.
    outputs:
      mq-version: ${{ steps.pmq.outputs.version }}
    env:
      GPR_USER: ${{ github.repository_owner }}
      GPR_TOKEN: ${{ secrets.MQ_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history: MQ measures a pull request from where it left master, and looks back through master
          # for the nearest commit its store holds the analysis of.
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # The open-source cache of the action. Its default is a proprietary one that comes with terms of use.
          cache-provider: basic
      - name: pmq, from GitHub Packages
        id: pmq
        if: env.GPR_TOKEN != ''
        run: |
          version="$(cat .github/pantrix-mq.version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          base="https://maven.pkg.github.com/developersancho/pantrix-mq/io/github/developersancho/pantrix/mq"
          curl -fsSL -u "$GPR_USER:$GPR_TOKEN" -o "$RUNNER_TEMP/pmq.zip" \
            "$base/pantrix-mq-scanner-cli/$version/pantrix-mq-scanner-cli-$version.zip"
          unzip -q "$RUNNER_TEMP/pmq.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/pmq-$version/bin" >> "$GITHUB_PATH"
      # MQ's store of baselines is a directory outside the checkout. A run of a push to master keeps its analysis in it
      # and uploads what it kept as an artifact named mq-baselines; every run brings the baselines of the commits
      # before it back from those artifacts, and takes one only from a run of a push to master in this repository.
      - name: MQ's store of baselines, from the artifacts master's runs left
        if: env.GPR_TOKEN != ''
        run: pmq baselines fetch --github --into "$RUNNER_TEMP/mq-baselines"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Android Lint, detekt and the unit tests with Kover, and MQ's analysis of them
        run: |
          mq=()
          if [ -n "$GPR_TOKEN" ]; then
            mq=(--init-script .github/pantrix-mq.init.gradle.kts mqAnalyze -Pmq.project=rorty-android
              "-Pmq.baselines=$RUNNER_TEMP/mq-baselines")
          fi
          ./gradlew lintReportDebug detekt koverXmlReportDebug --continue "${mq[@]}"
      # TRIAL, not to be merged: the part is left as an artifact and a job of its own judges it, as Android and iOS
      # on runners of their own would.
      - name: MQ's part, for the job that judges it
        if: ${{ !cancelled() && env.GPR_TOKEN != '' && hashFiles('build/mq/report.mqr') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mq-part-android
          path: build/mq/report.mqr
          retention-days: 1
      # TRIAL, not to be merged: the run goes on after the part is left, so that the workflow of the trial fetches it
      # from a run that is still going.
      - name: A wait, for the trial
        run: sleep 120

  mq:
    name: MQ's verdict
    needs: [checks]
    if: ${{ !cancelled() && needs.checks.outputs.mq-version != '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      # For MQ's store of baselines and for the part: the artifacts runs left, which this job downloads.
      actions: read
      # For MQ's verdict: a check on the commit, and on a pull request a comment that every run updates.
      checks: write
      pull-requests: write
    env:
      GPR_USER: ${{ github.repository_owner }}
      GPR_TOKEN: ${{ secrets.MQ_PACKAGES_TOKEN }}
    # TRIAL, not to be merged: no checkout. The parts, the store and pmq are all the verdict needs.
    steps:
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: 21
      - name: pmq, from GitHub Packages
        run: |
          version="${{ needs.checks.outputs.mq-version }}"
          base="https://maven.pkg.github.com/developersancho/pantrix-mq/io/github/developersancho/pantrix/mq"
          curl -fsSL -u "$GPR_USER:$GPR_TOKEN" -o "$RUNNER_TEMP/pmq.zip" \
            "$base/pantrix-mq-scanner-cli/$version/pantrix-mq-scanner-cli-$version.zip"
          unzip -q "$RUNNER_TEMP/pmq.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/pmq-$version/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mq-part-*
          path: parts
      - name: MQ's store of baselines, for the commits of the part
        run: |
          find parts -type f
          pmq baselines fetch --github --into "$RUNNER_TEMP/mq-baselines" --bundle parts/mq-part-android/report.mqr
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: MQ's verdict
        # The step fails only when MQ could not judge at all (1), and not when the gate failed (2) or is incomplete (3).
        run: |
          status=0
          pmq finalize \
            --bundles parts \
            --baselines "$RUNNER_TEMP/mq-baselines" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --github || status=$?
          if [ "$status" -eq 2 ] || [ "$status" -eq 3 ]; then status=0; fi
          exit "$status"
        env:
          GITHUB_TOKEN: ${{ github.token }}
