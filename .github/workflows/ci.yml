# The checks of the app on every push to master and every pull request: Android Lint, detekt and the unit tests with
# Kover, and Pantrix MQ's verdict on what they found.
#
# MQ comes from GitHub Packages of developersancho/pantrix-mq through .github/pantrix-mq.init.gradle.kts, so the
# build itself needs no token. MQ_PACKAGES_TOKEN is a token that only reads packages. A pull request from a fork has
# no secrets: its checks run, and MQ does not. The version of MQ is in .github/pantrix-mq.version, for the init script
# and for pmq alike.
name: CI

on:
  push:
    # TRIAL, not to be merged: the trial branch keeps its analyses in MQ's store of baselines in git refs.
    branches: [master, trial/git-store]
  pull_request:

permissions:
  contents: read

concurrency:
  # A newer push to a pull request makes the run for the older one pointless. On master every run is kept.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, detekt, unit tests and MQ
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      # TRIAL, not to be merged: MQ's store of baselines is in git refs of this repository, refs/mq/*, which a run
      # of the protected branch pushes to.
      contents: write
      # For MQ's verdict: a check on the commit, and on a pull request a comment that every run updates.
      checks: write
      pull-requests: write
    env:
      GPR_USER: ${{ github.repository_owner }}
      GPR_TOKEN: ${{ secrets.MQ_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # TRIAL, not to be merged: pmq pushes to refs/mq/* with the credentials the checkout keeps.
          persist-credentials: true
          # The whole history: MQ measures a pull request from where it left master, and looks back through master
          # for the nearest commit its store holds the analysis of.
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # The open-source cache of the action. Its default is a proprietary one that comes with terms of use.
          cache-provider: basic
      - name: pmq, from GitHub Packages
        if: env.GPR_TOKEN != ''
        run: |
          version="$(cat .github/pantrix-mq.version)"
          base="https://maven.pkg.github.com/developersancho/pantrix-mq/io/github/developersancho/pantrix/mq"
          curl -fsSL -u "$GPR_USER:$GPR_TOKEN" -o "$RUNNER_TEMP/pmq.zip" \
            "$base/pantrix-mq-scanner-cli/$version/pantrix-mq-scanner-cli-$version.zip"
          unzip -q "$RUNNER_TEMP/pmq.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/pmq-$version/bin" >> "$GITHUB_PATH"
      - name: Android Lint, detekt and the unit tests with Kover, and MQ's analysis of them
        run: |
          mq=()
          if [ -n "$GPR_TOKEN" ]; then
            mq=(--init-script .github/pantrix-mq.init.gradle.kts mqAnalyze -Pmq.project=rorty-android
              -Pmq.baselines=git:origin)
          fi
          ./gradlew lintReportDebug detekt koverXmlReportDebug --continue "${mq[@]}"
      - name: MQ's verdict
        id: verdict
        if: ${{ !cancelled() && env.GPR_TOKEN != '' && hashFiles('build/mq/report.mqr') != '' }}
        # The verdict is MQ's check, which says it once: the step fails only when MQ could not judge at all (1), and
        # not when the gate failed (2) or is incomplete (3). Master keeps its analysis, which its pull requests are
        # compared with.
        run: |
          status=0
          pmq finalize \
            --bundle build/mq/report.mqr \
            --baselines git:origin \
            --summary "$GITHUB_STEP_SUMMARY" \
            $MQ_KEEP --github || status=$?
          if [ "$status" -eq 2 ] || [ "$status" -eq 3 ]; then status=0; fi
          exit "$status"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MQ_KEEP: ${{ github.event_name == 'push' && '--keep' || '' }}
