[versions]
agp = "9.2.1"
coreKtx = "1.19.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
kotlin = "2.4.10"
composeBom = "2026.06.01"
pantrix = "1.0.0-beta.6"
# Navigation 3. 1.1.3 is the current STABLE line (1.2.0-alpha06 exists); it is also what the SDK's
# `pantrix-compose-navigation3` is compiled against, so this is the version the integration is proven on.
nav3 = "1.1.3"
lifecycleViewmodelNav3 = "2.11.0"
ktor = "3.5.0"
# Koin, not Hilt. Hilt needs KSP and KSP's newest release is 2.3.10 — there is none for Kotlin 2.4.x.
# Koin resolves at runtime, so it has no compiler plugin and no Kotlin-version coupling. Together with
# kotlinx.serialization (compiler plugin, ships with Kotlin) and Coil 3 (no codegen), this app runs
# with ZERO annotation processors — which is exactly what lets it sit on Kotlin 2.4.10.
koin = "4.2.2"
coil = "3.5.0"
glance = "1.1.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# Navigation 3 — the backstack IS a list you own, so there is no NavController and no graph DSL.
androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "nav3" }
androidx-navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "nav3" }
androidx-lifecycle-viewmodel-navigation3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "lifecycleViewmodelNav3" }

# Ktor. The engine is a separate artifact on purpose — `pantrix-ktor` declares BOTH core and engine
# `compileOnly`, so the consumer picks them.
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }

koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
koin-androidx-compose = { group = "io.insert-koin", name = "koin-androidx-compose", version.ref = "koin" }

coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# Pantrix. `pantrix-sdk` is the fused core (api + core + android + crash + okhttp). The four add-ons
# below are SEPARATE artifacts and every one of their own dependencies is `compileOnly` — Compose UI,
# navigation3, Ktor core+engine all come from the entries above. A missing Pantrix symbol is almost
# always a missing peer, not a missing Pantrix dependency.
pantrix-sdk = { group = "com.pantrix.analytics", name = "pantrix-sdk", version.ref = "pantrix" }
pantrix-compose = { group = "com.pantrix.analytics", name = "pantrix-compose", version.ref = "pantrix" }
pantrix-compose-navigation3 = { group = "com.pantrix.analytics", name = "pantrix-compose-navigation3", version.ref = "pantrix" }
pantrix-ktor = { group = "com.pantrix.analytics", name = "pantrix-ktor", version.ref = "pantrix" }
pantrix-inspector = { group = "com.pantrix.analytics", name = "pantrix-inspector", version.ref = "pantrix" }
pantrix-inspector-noop = { group = "com.pantrix.analytics", name = "pantrix-inspector-noop", version.ref = "pantrix" }
pantrix-feedback = { group = "com.pantrix.analytics", name = "pantrix-feedback", version.ref = "pantrix" }
pantrix-feedback-noop = { group = "com.pantrix.analytics", name = "pantrix-feedback-noop", version.ref = "pantrix" }
pantrix-widget = { group = "com.pantrix.analytics", name = "pantrix-widget", version.ref = "pantrix" }
pantrix-widget-noop = { group = "com.pantrix.analytics", name = "pantrix-widget-noop", version.ref = "pantrix" }

# Peer of pantrix-widget, which declares Glance `compileOnly`. Debug only — the other variants take
# the `-noop` twin, which registers no receiver and needs nothing.
glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Ships with Kotlin itself, so it is version-locked to `kotlin` and needs no KSP.
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
pantrix-gradle = { id = "com.pantrix.gradle", version.ref = "pantrix" }

